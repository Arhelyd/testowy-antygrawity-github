version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: local-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: local-tunnel
    command: tunnel --url http://jenkins:8080
    restart: always
    depends_on:
      - jenkins

volumes:
  jenkins_home:
